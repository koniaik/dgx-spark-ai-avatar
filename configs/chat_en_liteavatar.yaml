default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8899
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
      - "custom_handlers"   # Polish speech handlers from this repo
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      SpeachesASR:
        enabled: True
        module: pl_speaches_asr/asr_handler_speaches
        base_url: "http://127.0.0.1:8000/v1"
        # id modelu zgodny z tym, co raportuje Speaches: curl http://127.0.0.1:8000/v1/models
        model_name: "deepdml/faster-whisper-large-v3-turbo-ct2"
        language: "en"
      SpeachesTTS:
        enabled: True
        module: pl_speaches_tts/tts_handler_speaches
        base_url: "http://127.0.0.1:8000/v1"
        # Piper voice id — browse languages via the Speaches registry (see README)
        model_name: "speaches-ai/piper-en_US-amy-medium"
        voice: "default"
        sample_rate: 22050
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        # any OpenAI-compatible LLM — local server or cloud provider (see README)
        model_name: "your-local-model-id"  # id from your LLM server (GET /v1/models)
        enable_video_input: False
        history_length: 20
        system_prompt: "You are a friendly AI assistant visible as an avatar. Always answer in English, keep it short (2-3 sentences), in a natural spoken style with correct punctuation. Do not use markdown, lists or emoji."
        api_url: "http://127.0.0.1:8888/v1"
        api_key: "EMPTY"  # set if your LLM endpoint requires a key
      # === Awatar: gotowy sample z galerii LiteAvatar (start natychmiast) ===
      LiteAvatar:
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: 20250408/sample_data
        fps: 25
        debug: false
        enable_fast_mode: false
        use_gpu: true
